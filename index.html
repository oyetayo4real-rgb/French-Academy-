ouve que)","Connector (cependant, d'abord, ensuite, pourtant)","At least 60 words"]},"speak":[["Describe a childhood habit.","Quand j'étais enfant, j'allais chez mes grands-parents chaque été."],["Give your opinion about remote work.","À mon avis, le télétravail est très pratique."],["Disagree politely.","Je ne suis pas tout à fait d'accord avec toi."],["Ask to change a booking.","Je voudrais changer ma réservation, s'il vous plaît."],["Say what you would do with more time.","Si j'avais plus de temps, je voyagerais."]]},"B2":{"listen":[["Listen and choose the meaning.",["On the one hand technology makes life easier; on the other, it creates dependence.","Although people talk about it a lot, the problem persists.","I doubt that this solution is sufficient."],"Bien qu'on en parle beaucoup, le problème persiste."],["Listen and choose the meaning.",["I am writing to apply for the position of marketing manager.","Please find my CV attached.","In conclusion, it is essential that everyone takes part."],"En conclusion, il est essentiel que chacun participe."],["Listen and choose the meaning.",["The project, which we launched in March, exceeded our expectations.","I am available for an interview at your convenience.","Yours faithfully (formal closing)."],"Le projet, que nous avons lancé en mars, a dépassé nos attentes."],["Listen and choose the meaning.",["If the government had reacted earlier, the crisis would have been avoided.","This city was built in the nineteenth century.","Young people's use of screens keeps increasing."],"Cette ville a été construite au dix-neuvième siècle."],["Listen and choose the meaning.",["The government must act quickly.","Although people talk about it a lot, the problem persists.","Opinions differ on this question."],"Les avis divergent sur cette question."]],"read":{"text":"Depuis quelques années, le télétravail s'est imposé dans de nombreuses entreprises. Bien qu'il offre plus de flexibilité, certains salariés se sentent isolés. Selon une étude récente, les cadres dont l'entreprise organise des journées au bureau sont plus satisfaits. Il est donc essentiel que les employeurs trouvent un équilibre entre présence et autonomie.","q":[["What is the main topic?",["remote work","university fees","public transport"]],["What advantage is mentioned?",["higher salaries","flexibility","shorter days"]],["What problem do some employees feel?",["boredom","stress","isolation"]],["Who is more satisfied?",["managers whose company organises office days","people who never go to the office","new graduates"]],["What does the author conclude?",["remote work should end","employers should balance presence and autonomy","salaries must rise"]]]},"write":{"prompt":"Write an argumentative text (about 120 words): should universities offer more online courses? Give your opinion, one argument for and one against, and conclude.","crit":["Opinion (à mon avis / je pense que / selon moi)","Subjunctive trigger (il faut que, bien que, il est essentiel que…)","Contrast (d'une part… d'autre part, cependant, en revanche)","Conclusion (en conclusion, pour conclure, enfin)","At least 100 words"]},"speak":[["Give an opinion with one argument on screens in school.","À mon avis, les écrans aident à apprendre ; cependant, il faut que les élèves restent concentrés."],["Use “il faut que” in a sentence.","Il faut que nous agissions rapidement."],["Open a formal job application.","Je vous écris pour postuler au poste de responsable."],["Say a sentence in the passive.","Cette loi a été votée hier."],["Express a regret about the past.","Si j'avais su, je serais venu."]]},"C1":{"listen":[["Listen and choose the meaning.",["Insofar as resources are limited, they should be distributed fairly.","Be that as it may, it would be reductive to see it as a mere fad.","The result is a notable drop in productivity."],"Quoi qu'il en soit, il serait réducteur d'y voir un simple effet de mode."],["Listen and choose the meaning.",["This study aims to analyse the impact of globalisation on employment.","The author claims that language structures thought.","In other words, everything depends on the context."],"Autrement dit, tout dépend du contexte."],["Listen and choose the meaning.",["By working harder, she ended up succeeding.","The results, although encouraging, remain to be confirmed.","The implementation of this reform is drawing sharp criticism."],"En travaillant davantage, elle a fini par réussir."],["Listen and choose the meaning.",["It occurred to me that we could change approach.","I wouldn't want to butt in.","That goes without saying."],"Je ne voudrais pas mettre mon grain de sel."],["Listen and choose the meaning.",["It must be acknowledged that the situation has deteriorated.","Be that as it may, it would be reductive to see it as a mere fad.","I would like to thank you for having welcomed me."],"Je tiens à vous remercier de m'avoir accueilli."]],"read":{"text":"La question de l'authenticité à l'ère numérique divise les chercheurs. Certes, les réseaux sociaux permettent à chacun de s'exprimer ; il n'en demeure pas moins que cette visibilité encourage la mise en scène de soi. Dans la mesure où les algorithmes favorisent les contenus polarisants, le débat public s'en trouve appauvri. Force est de constater que les utilisateurs, en cherchant l'approbation, finissent par adopter des opinions qui ne sont pas les leurs.","q":[["What divides researchers?",["authenticity in the digital age","school reform","climate policy"]],["What positive point is conceded?",["lower prices","faster news","everyone can express themselves"]],["What does visibility encourage?",["self-staging","privacy","silence"]],["Why is public debate impoverished?",["too few users","algorithms favour polarising content","censorship"]],["What is observed about users?",["they stop posting","they avoid debate","seeking approval, they adopt opinions not their own"]]]},"write":{"prompt":"Write a structured essay (about 150 words): does social media improve or weaken public debate? Use a concession, cause and consequence, and a clear conclusion.","crit":["Concession (certes, il n'en demeure pas moins, quoi qu'il en soit)","Cause (dans la mesure où, d'autant que, puisque, car)","Consequence (par conséquent, il en résulte, c'est pourquoi)","Conclusion (en conclusion, en somme, en définitive)","At least 130 words"]},"speak":[["Introduce an observation formally.","Force est de constater que la situation a changé."],["Make a concession.","Certes, l'idée est séduisante ; il n'en demeure pas moins qu'elle est risquée."],["Report what someone said.","Il a dit qu'il avait déjà terminé."],["Use the gérondif.","En travaillant davantage, elle a réussi."],["Use an idiom.","Il pleut des cordes !"]]},"C2":{"listen":[["Listen and choose the meaning.",["Everything suggests the phenomenon is more complex than it appears.","Far from merely describing, the author questions the assumptions.","It is therefore appropriate to put these conclusions into perspective."],"Loin de se contenter de décrire, l'auteur interroge les présupposés."],["Listen and choose the meaning.",["He got up, opened the window and gazed at the sea.","She said not a word, but her look said a great deal.","All things considered, caution is called for."],"À tout prendre, la prudence s'impose."],["Listen and choose the meaning.",["Never had such music been heard.","No sooner had he finished than the crowd applauded.","Thus ends this tale."],"Jamais on n'avait entendu pareille musique."],["Listen and choose the meaning.",["Whoever meddles with it gets stung.","It's not bad at all (it's rather good).","It is better to think carefully before speaking."],"Ce n'est pas mal du tout."],["Listen and choose the meaning.",["It is not so much a matter of denying the obvious as of qualifying its scope.","Far from merely describing, the author questions the assumptions.","It's not that difficult."],"Ce n'est pas la mer à boire."]],"read":{"text":"Il serait tentant de n'y voir qu'une querelle de mots ; or, c'est bien la définition même de la liberté qui est en jeu. Loin de s'opposer frontalement, les deux thèses se répondent : l'une insiste sur l'autonomie de l'individu, l'autre sur les conditions sociales qui la rendent possible. Aussi convient-il, plutôt que de trancher, d'en éprouver la complémentarité.","q":[["What would be tempting?",["to see only a quarrel over words","to ignore the topic","to change the law"]],["What is really at stake?",["a legal reform","the definition of freedom","economic growth"]],["How are the two theses related?",["they are opposed","they are identical","they respond to each other"]],["What does one thesis stress?",["individual autonomy","state control","tradition"]],["What does the author recommend?",["choosing one thesis","testing their complementarity rather than choosing","ignoring both"]]]},"write":{"prompt":"Write a nuanced commentary (about 180 words) on the proverb « Les promesses n'engagent que ceux qui les croient ». Analyse its meaning, qualify it, and conclude, using at least one inversion.","crit":["Nuance (certes, toutefois, néanmoins, il convient de)","Inversion (aussi convient-il, peut-être est-ce, à peine…)","Precise structure (loin de, il ne s'agit pas tant, tout porte à croire)","Conclusion (en définitive, en somme, pour conclure)","At least 150 words"]},"speak":[["Nuance a claim.","Il ne s'agit pas tant de refuser que de nuancer."],["Use a litote.","Ce n'est pas mal du tout."],["Quote a proverb.","Qui s'y frotte s'y pique."],["Use an inversion.","Aussi convient-il d'être prudent."],["Summarise an argument in one sentence.","À tout prendre, la prudence s'impose."]]}};

addLs(0,["🙋","Se présenter",["Introduce yourself in full.","Say your nationality, profession and languages.","Give your age and where you live."],"Professions after <b>être</b> take no article: <i>Je suis étudiant</i>. Origin: <b>venir de</b> (<i>du Canada, de France, des États-Unis</i>). Languages: <i>je parle français</i>.",[["🙋","Je m'appelle Paul et je suis étudiant.","My name is Paul and I am a student."],["🌍","Je viens du Canada.","I come from Canada."],["🗣️","Je parle anglais et un peu français.","I speak English and a little French."],["🎂","J'ai dix-neuf ans.","I am nineteen years old."],["💼","Mon père est médecin.","My father is a doctor."],["🏠","J'habite dans une petite maison.","I live in a small house."]],[["Je ___ étudiant.",["suis","ai","vais"],0],["“Je viens de France” means…",["I am going to France","I come from France","I live in France"],1]]]);
addLs(0,["🕐","Le temps et l'heure",["Say the day and the time.","Tell time with et quart, et demie, moins le quart.","Describe the weather."],"Days are not capitalised: <i>lundi</i>. With <b>le</b> it means “every Monday”: <i>le lundi</i>. Time: <b>Il est + heure(s)</b>. Weather: <b>il fait / il pleut</b>.",[["📆","Aujourd'hui, c'est lundi.","Today is Monday."],["🕐","Il est une heure.","It is one o'clock."],["🕗","Il est huit heures et demie.","It is half past eight."],["🕒","Il est trois heures moins le quart.","It is a quarter to three."],["☀️","Il fait beau aujourd'hui.","The weather is nice today."],["🌧️","Il pleut en automne.","It rains in autumn."]],[["“Il est huit heures et demie” is…",["8:15","8:30","7:30"],1],["Which means “on Mondays”?",["lundi","un lundi","le lundi"],2]]]);
addLs(1,["⏰","La routine",["Describe your daily routine.","Use reflexive verbs (me, te, se…).","Order actions with ensuite, puis, le soir."],"<b>Reflexive verbs</b> use me/te/se/nous/vous/se: <i>je me réveille</i>. Before a vowel: <i>je m'habille</i>. In the passé composé they always take <b>être</b>: <i>je me suis réveillé</i>.",[["⏰","Je me réveille à sept heures.","I wake up at seven."],["🚿","Je me lave et je m'habille.","I wash and get dressed."],["🍳","Ensuite, je prends mon petit-déjeuner.","Then I have breakfast."],["🚌","Je pars à l'université à huit heures.","I leave for university at eight."],["📚","L'après-midi, j'étudie à la bibliothèque.","In the afternoon I study at the library."],["🌙","Le soir, je me couche vers onze heures.","In the evening I go to bed around eleven."]],[["Choose: Je ___ lave.",["te","se","me"],2],["The passé composé of se coucher uses…",["avoir","être","aller"],1]]]);
addLs(2,["🏥","La santé",["Describe symptoms and make an appointment.","Use depuis and avoir mal à.","Give simple health advice."],"<b>Avoir mal à</b> + body part: <i>j'ai mal à la tête</i> (à + le = au: <i>au dos</i>). <b>Depuis</b> + present = since / for. Advice: <b>il faut</b> + infinitive, or the imperative (<i>revenez</i>).",[["🤒","J'ai mal à la tête depuis hier.","I have had a headache since yesterday."],["🏥","Je voudrais prendre rendez-vous chez le médecin.","I would like to make an appointment with the doctor."],["💊","Le médecin m'a prescrit des médicaments.","The doctor prescribed me medication."],["🥗","Il faut manger équilibré et faire du sport.","You should eat a balanced diet and exercise."],["😴","Je me sens fatigué parce que je dors mal.","I feel tired because I sleep badly."],["📅","Revenez dans une semaine si ça ne va pas mieux.","Come back in a week if you are not better."]],[["“J'ai mal au dos” means…",["I have a backache","I am hungry","I am cold"],0],["“Depuis hier” + present tense means…",["until tomorrow","since yesterday","only yesterday"],1]]]);
addLs(3,["🌍","Environnement et technologie",["Discuss environmental and technology issues.","Express hypotheses with si + imparfait.","Use abstract nouns typical of written B2."],"<b>Si + imparfait → conditionnel</b>: <i>si nous investissions, nous réduirions…</i>. <b>Il faudrait que + subjunctive</b> is a softer necessity. Abstract nouns (<i>la protection, l'usage, la transition</i>) are typical of B2 writing.",[["🌍","La transition écologique est devenue une priorité.","The ecological transition has become a priority."],["🔋","Si nous investissions dans les énergies renouvelables, nous réduirions nos émissions.","If we invested in renewable energy, we would reduce our emissions."],["🤖","L'intelligence artificielle soulève de nombreuses questions éthiques.","Artificial intelligence raises many ethical questions."],["📵","Certains estiment qu'il faudrait limiter l'usage des écrans.","Some think screen use should be limited."],["🔐","La protection des données personnelles est un enjeu essentiel.","The protection of personal data is an essential issue."],["♻️","Chacun peut contribuer à réduire les déchets.","Everyone can help reduce waste."]],[["Si nous investissions, nous ___.",["réduirions","réduirons","réduisions"],0],["“Un enjeu” means…",["a game","an issue at stake","an injury"],1]]]);
addLs(4,["🗣️","Débat d'idées",["Announce, challenge and conclude an argument.","Distinguish levels of analysis.","Choose precise verbs (démontrer, nuancer, contester)."],"Debate moves: announce (<i>je vais m'attacher à…</i>), challenge (<i>cet argument repose sur…</i>), contrast (<i>contrairement à ce que…</i>), distinguish (<i>il convient de…</i>), conclude (<i>pour conclure</i>). Prefer precise verbs over generic ones (dire, faire).",[["🗣️","Je vais m'attacher à démontrer que cette thèse est fragile.","I am going to set out to show that this thesis is fragile."],["🧱","Cet argument repose sur un présupposé contestable.","This argument rests on a debatable assumption."],["🔄","Contrairement à ce que l'on croit, la réalité est plus nuancée.","Contrary to what people think, reality is more nuanced."],["📏","Il convient de distinguer deux niveaux d'analyse.","It is appropriate to distinguish two levels of analysis."],["🎯","Tel est précisément l'enjeu de ce débat.","Such is precisely what is at stake in this debate."],["🧭","Pour conclure, la question demeure ouverte.","To conclude, the question remains open."]],[["“Un présupposé” is…",["a prediction","a punishment","an assumption taken for granted"],2],["“Contrairement à” means…",["in addition to","contrary to","thanks to"],1]]]);
addLs(5,["🔎","Analyse de texte",["Comment on a literary text precisely.","Use d'autant plus… que and commentary verbs.","Structure: observation, interpretation, effect."],"<b>D'autant plus… que</b> = all the more… as. Commentary verbs: <i>traduire, révéler, laisser entrevoir, feindre, trancher</i>. <b>En filigrane</b> = between the lines. Structure: observation → interpretation → effect on the reader.",[["🔎","Le narrateur feint l'indifférence, mais le lecteur n'est pas dupe.","The narrator feigns indifference, but the reader is not fooled."],["🎼","La cadence des phrases traduit l'urgence du propos.","The rhythm of the sentences conveys the urgency of the message."],["🪞","L'ironie y est d'autant plus mordante qu'elle reste discrète.","The irony is all the more biting for remaining discreet."],["🧵","Ce motif revient comme un leitmotiv tout au long du roman.","This motif recurs like a leitmotif throughout the novel."],["⚖️","L'auteur ne tranche pas : il laisse planer l'ambiguïté.","The author doesn't decide: he lets the ambiguity hang."],["🏁","Ainsi se dessine, en filigrane, une critique de la société.","Thus a critique of society emerges between the lines."]],[["“En filigrane” means…",["subtly, between the lines","in great detail","at the end"],0],["“Feindre” means…",["to fear","to finish","to pretend"],2]]]);
addLs(0,["🏠","La maison",["Name the rooms of a house.","Say what there is in a room (il y a).","Ask where something is (Où est… ?)."],"<b>Il y a</b> = there is / there are: <i>Il y a un lit dans la chambre.</i> <b>Où est…?</b> asks for a place. <b>Voici / voilà</b> = here is / there is.",[["🏠","J'habite dans un appartement.","I live in an apartment."],["🛏️","Voici ma chambre.","Here is my bedroom."],["🪑","Il y a un lit et une table.","There is a bed and a table."],["🍳","La cuisine est petite.","The kitchen is small."],["🚿","Où est la salle de bain ?","Where is the bathroom?"],["🛋️","Le salon est très grand.","The living room is very big."]],[["“Il y a” means…",["there is / there are","he has","he goes"],0],["“La cuisine” is…",["the kitchen","the bedroom","the garden"],0]]]);
addLs(1,["⚽","Les loisirs",["Talk about hobbies and sports.","Use jouer à / jouer de / faire de correctly.","Say what you prefer."],"<b>jouer à</b> + sport (<i>jouer au football</i>); <b>jouer de</b> + instrument (<i>jouer du piano</i>); <b>faire de</b> + activity (<i>faire de la natation</i>). <b>aimer / préférer</b> + infinitive.",[["⚽","J'aime jouer au football.","I like playing football."],["🏊","Je fais de la natation le mardi.","I go swimming on Tuesdays."],["🎬","Nous allons au cinéma samedi.","We are going to the cinema on Saturday."],["🎹","Elle joue du piano.","She plays the piano."],["❓","Qu'est-ce que tu fais le week-end ?","What do you do at the weekend?"],["📖","Je préfère lire un livre.","I prefer to read a book."]],[["Choose: Elle joue ___ piano.",["au","du","de la"],1],["“Je fais de la natation” means…",["I swim / go swimming","I watch swimming","I teach swimming"],0]]]);
addLs(2,["🎓","Études et projets",["Talk about your studies.","Express goals and plans.","Explain why you chose a course."],"<b>Parce que</b> + verb = because. <b>Pour</b> + infinitive = in order to. <b>Après</b> + past infinitive: <i>après avoir fini mes études</i>. <b>Devoir</b> = must: <i>je dois rendre…</i>",[["🎓","Je suis en deuxième année de licence.","I am in the second year of my bachelor's degree."],["📚","J'ai choisi cette filière parce qu'elle m'intéresse.","I chose this course because it interests me."],["🌍","Après avoir fini mes études, je voudrais travailler à l'étranger.","After finishing my studies I would like to work abroad."],["⏰","Je dois rendre mon mémoire avant la fin du mois.","I must hand in my dissertation before the end of the month."],["🎯","Mon rêve est de devenir enseignant.","My dream is to become a teacher."],["📝","Il faut que je réussisse mes examens.","I must pass my exams."]],[["“Parce que” means…",["because","although","until"],0],["“Je dois rendre…” means…",["I must hand in…","I like to give…","I returned…"],0]]]);
addLs(3,["🏛️","Vie universitaire",["Discuss university life and requirements.","Use formal expressions of necessity.","Refer to research and results."],"<b>Il est indispensable que + subjunctive</b>. <b>Porter sur</b> = to be about (<i>cette thèse porte sur…</i>). <b>Compte tenu de</b> = given, taking into account. <b>Valider</b> = to pass / validate a module.",[["🏛️","L'université propose plusieurs filières.","The university offers several courses."],["✅","Les étudiants doivent valider leurs crédits.","Students must earn their credits."],["📌","Il est indispensable que vous rendiez le dossier à temps.","It is essential that you submit the file on time."],["🔬","Cette thèse porte sur l'impact des réseaux sociaux.","This thesis is about the impact of social media."],["📊","Compte tenu des résultats, il faudrait revoir la méthode.","Given the results, the method should be reviewed."],["🧑‍🏫","Le professeur a insisté sur l'importance de la recherche.","The professor stressed the importance of research."]],[["Il est indispensable que vous ___ à l'heure.",["arrivez","arriviez","arriverez"],1],["“Compte tenu de” means…",["given / taking into account","in spite of","instead of"],0]]]);
addLs(4,["💼","Communication professionnelle",["Write and speak in a professional register.","Politely ask, refuse and negotiate.","Use formal openings and closings."],"Formal register: <i>Je me permets de vous contacter…</i>, <i>Je vous serais reconnaissant de…</i> (conditional). Soften refusals: <i>Malheureusement, il ne nous est pas possible de…</i>",[["💼","Je me permets de vous contacter au sujet de votre offre.","I am taking the liberty of contacting you about your offer."],["🙏","Je vous serais reconnaissant de bien vouloir me répondre rapidement.","I would be grateful if you could reply quickly."],["📅","Seriez-vous disponible mardi prochain ?","Would you be available next Tuesday?"],["🚫","Malheureusement, il ne nous est pas possible de donner suite.","Unfortunately, we are unable to proceed."],["🤝","Nous sommes parvenus à un accord satisfaisant pour les deux parties.","We have reached an agreement satisfactory to both parties."],["📨","Dans l'attente de votre retour, je reste à votre disposition.","Awaiting your reply, I remain at your disposal."]],[["“Je vous serais reconnaissant de…” is…",["a very polite request","a complaint","a past event"],0],["“À votre disposition” means…",["at your disposal","in your opinion","against your will"],0]]]);
addLs(5,["🖋️","Rhétorique et style",["Recognise elevated rhetorical structures.","Use ne … saurait and quand bien même.","Control register and emphasis."],"<b>On ne saurait + infinitive</b> = one cannot (formal). <b>Quand bien même + conditional</b> = even if. <b>Nul</b> = no one (<i>nul n'ignore que…</i>). <b>À maints égards</b> = in many respects.",[["🖋️","À maints égards, cette thèse paraît séduisante.","In many respects this thesis seems appealing."],["📣","Nul n'ignore que les mots peuvent blesser.","No one is unaware that words can hurt."],["🧱","Faute de preuves, on ne saurait conclure.","Lacking evidence, one cannot conclude."],["🔁","Quand bien même ce serait vrai, la conclusion ne s'imposerait pas.","Even if it were true, the conclusion would not follow."],["💬","Il va sans dire que la prudence reste de mise.","It goes without saying that caution remains appropriate."],["🏁","Tel est, en somme, le fin mot de l'histoire.","Such, in short, is the long and short of the matter."]],[["“Nul n'ignore que…” means…",["everyone knows that…","no one knows that…","one may ignore that…"],0],["“Quand bien même” + conditional means…",["even if","because","as soon as"],0]]]);
addLs(0,["🎓","À l'université",["Talk about your studies.","Name classroom objects.","Ask for help and repetition politely."],"<b>Classroom survival phrases</b>: <i>Je ne comprends pas. Pouvez-vous répéter ? Comment dit-on… en français ?</i> <b>Pouvez-vous…?</b> is the polite “can you…?”. With <b>le</b> a day means “every”: <i>le mardi</i> = on Tuesdays.",[["🎓","Je suis étudiant à l'université.","I am a student at the university."],["📚","J'ai un cours de français le mardi.","I have a French class on Tuesdays."],["✏️","Voici mon stylo et mon cahier.","Here are my pen and my notebook."],["🏫","La bibliothèque est ouverte jusqu'à six heures.","The library is open until six o'clock."],["🙋","Excusez-moi, je ne comprends pas.","Excuse me, I don't understand."],["🔁","Pouvez-vous répéter, s'il vous plaît ?","Can you repeat, please?"]],[["“Je ne comprends pas” means…",["I don't understand","I don't know you","I don't have it"],0],["Politely ask someone to repeat:",["Répète !","Pouvez-vous répéter ?","Je répète"],1]]]);
addLs(0,["🏠","La maison",["Describe your home and its rooms.","Say where things are (sur, sous, dans, devant…).","Use il y a."],"<b>Il y a</b> = there is / there are. Prepositions of place: <b>sur, sous, dans, devant, derrière, à côté de</b>. <b>à + le = au</b>, <b>à + les = aux</b>.",[["🏠","J'habite dans un appartement au deuxième étage.","I live in an apartment on the second floor."],["🛏️","Ma chambre est petite mais confortable.","My bedroom is small but comfortable."],["🍳","La cuisine est à côté du salon.","The kitchen is next to the living room."],["🚪","Il y a une porte et deux fenêtres.","There is a door and two windows."],["🪑","Sur la table, il y a un livre.","On the table there is a book."],["🐱","Le chat est sous le lit.","The cat is under the bed."]],[["“Il y a un livre” means…",["There is a book","He has a book","It is a book"],0],["“Sous” means…",["on","under","in front of"],1]]]);
addLs(1,["🍽️","Au restaurant",["Book a table and order a full meal.","Ask for recommendations politely.","Ask for the bill."],"<b>Je prendrai</b> (futur) and <b>je voudrais</b> (conditionnel) are polite ways to order. <b>Qu'est-ce que…</b> = what (question). <b>Nous voudrions</b> = we would like.",[["🍽️","Une table pour deux personnes, s'il vous plaît.","A table for two, please."],["📖","Qu'est-ce que vous me conseillez ?","What do you recommend?"],["🍲","Je prendrai le menu à vingt euros.","I will have the twenty-euro menu."],["🥤","Comme boisson, une eau minérale.","To drink, a mineral water."],["😋","C'était délicieux, merci beaucoup.","It was delicious, thank you very much."],["🧾","Nous voudrions l'addition, s'il vous plaît.","We would like the bill, please."]],[["“Qu'est-ce que vous me conseillez ?” asks for…",["a recommendation","the price","the time"],0],["Polite “we would like”:",["nous voulons","nous voudrions","nous avons"],1]]]);
addLs(1,["⚽","Loisirs et fréquence",["Talk about hobbies and how often you do them.","Use jouer à / jouer de correctly.","Use frequency adverbs."],"<b>jouer à</b> + sport/game (<i>jouer au football</i>); <b>jouer de</b> + instrument (<i>jouer du piano</i>). Frequency: <b>toujours, souvent, parfois, rarement, jamais</b> (<i>jamais</i> goes with ne: <i>je ne vais jamais…</i>). <b>Depuis</b> + present.",[["⚽","Le samedi, je joue au football avec mes amis.","On Saturdays I play football with my friends."],["🎹","Elle joue du piano depuis trois ans.","She has been playing the piano for three years."],["🎬","Je vais souvent au cinéma le week-end.","I often go to the cinema at the weekend."],["📖","Je lis rarement le journal.","I rarely read the newspaper."],["🏊","Nous nageons deux fois par semaine.","We swim twice a week."],["🎵","Après les cours, j'écoute de la musique.","After class I listen to music."]],[["Complete: Il joue ___ guitare.",["à la","de la","au"],1],["“Rarement” means…",["often","rarely","always"],1]]]);
addLs(2,["📺","Médias et information",["Talk about news and media.","Cite sources (d'après, selon).","Express positive vs negative cause."],"<b>D'après / selon</b> + source = according to. <b>Grâce à</b> (positive cause) vs <b>à cause de</b> (negative cause). <b>On dit que…</b> reports a general opinion. <b>Avant de</b> + infinitive.",[["📺","Hier soir, j'ai regardé le journal télévisé.","Last night I watched the TV news."],["📰","D'après cet article, le chômage a diminué.","According to this article, unemployment has fallen."],["📱","Je me tiens informé grâce aux réseaux sociaux.","I keep myself informed thanks to social media."],["❓","Il faut vérifier la source avant de partager.","You should check the source before sharing."],["🎙️","Cette émission était très intéressante.","This programme was very interesting."],["🗞️","On dit que le projet sera adopté bientôt.","They say the project will be adopted soon."]],[["“Grâce à” introduces…",["a positive cause","a negative cause","a place"],0],["“D'après cet article” means…",["after this article","according to this article","about this article"],1]]]);
addLs(2,["💼","Au travail",["Apply for a job or internship.","Describe your skills and qualities.","Write a polite professional reply."],"<b>Poser sa candidature</b> = to apply. <b>Avoir lieu</b> = to take place. <b>Je me débrouille</b> = I get by. <b>J'aimerais</b> (conditionnel) is more polite than <i>je veux</i>. Futur simple: <i>aura lieu</i>.",[["💼","J'ai posé ma candidature pour un stage.","I applied for an internship."],["🗓️","L'entretien aura lieu mardi à dix heures.","The interview will take place on Tuesday at ten."],["🧠","Je suis quelqu'un de motivé et de sérieux.","I am a motivated and serious person."],["🌐","Je parle couramment anglais et je me débrouille en français.","I speak English fluently and I get by in French."],["📧","Je vous remercie de votre réponse rapide.","Thank you for your quick reply."],["🤝","J'aimerais beaucoup travailler dans votre équipe.","I would really like to work in your team."]],[["“Avoir lieu” means…",["to take place","to be late","to have room"],0],["The most polite option:",["Je veux travailler ici","J'aimerais travailler ici","Je travaille ici"],1]]]);
addLs(3,["💰","Économie et consommation",["Describe economic trends.","Use verbs of change and tendency.","Express hypotheses about the economy."],"<b>Avoir tendance à</b> + infinitive. <b>Il vaut mieux</b> + infinitive. <b>Ne cesser de</b> + infinitive = to keep on. Verbs of change: <i>augmenter, diminuer, se développer, repartir</i>. <b>Si + imparfait → conditionnel</b>.",[["💰","Le pouvoir d'achat des ménages a diminué.","Household purchasing power has fallen."],["🛒","On a tendance à acheter plus que nécessaire.","We tend to buy more than necessary."],["📉","Les prix ont augmenté de manière significative.","Prices have risen significantly."],["🏦","Il vaut mieux épargner que dépenser sans compter.","It is better to save than to spend without counting."],["📦","Les achats en ligne ne cessent de se développer.","Online shopping keeps growing."],["⚖️","Si les salaires augmentaient, la consommation repartirait.","If wages rose, consumption would pick up again."]],[["“Ne cesser de” means…",["to keep on doing","to stop doing","to try doing"],0],["“Épargner” means…",["to spend","to borrow","to save (money)"],2]]]);
addLs(3,["🎭","Culture et patrimoine",["Talk about festivals, museums and heritage.","Use venir de + infinitive (recent past).","Use il est indispensable que + subjunctive."],"<b>Venir de</b> + infinitive = to have just: <i>il vient de rouvrir</i> (passé récent). <b>Mettre en lumière</b> = to highlight. <b>Il est indispensable que</b> + subjunctive: <i>qu'ils s'intéressent</i>.",[["🎭","Ce festival attire des visiteurs du monde entier.","This festival attracts visitors from all over the world."],["🏛️","Le musée vient de rouvrir après deux ans de travaux.","The museum has just reopened after two years of renovation."],["🎨","L'exposition met en lumière des artistes peu connus.","The exhibition highlights little-known artists."],["📚","Ce roman a été adapté au cinéma.","This novel has been adapted for the cinema."],["🌍","Préserver le patrimoine est une responsabilité collective.","Preserving heritage is a collective responsibility."],["🗣️","Il est indispensable que les jeunes s'y intéressent.","It is essential that young people take an interest in it."]],[["“Il vient de rouvrir” means…",["He has just reopened","He will reopen","He never reopens"],0],["After “il est indispensable que” use…",["the indicative","the subjunctive","the infinitive only"],1]]]);
addLs(4,["📝","Rédiger un rapport",["Write the opening, findings and recommendations of a report.","Hedge conclusions carefully.","Use formal reporting phrases."],"Report phrases: <b>avoir pour objet de</b>, <b>il ressort de… que</b>, <b>au vu de</b>, <b>en définitive</b>. Hedge with <b>toutefois / il convient de relativiser</b>. Recommend with <b>nous recommandons</b> + noun, or <b>que</b> + subjunctive.",[["📝","Ce rapport a pour objet d'évaluer l'efficacité du dispositif.","The purpose of this report is to assess the effectiveness of the scheme."],["📊","Il ressort de l'enquête que la majorité des répondants est satisfaite.","The survey shows that most respondents are satisfied."],["🔍","Les causes de ce phénomène sont multiples et interdépendantes.","The causes of this phenomenon are multiple and interdependent."],["⚠️","Il convient toutefois de relativiser ces résultats.","It is, however, appropriate to put these results into perspective."],["📌","Au vu de ces éléments, nous recommandons une approche progressive.","In view of these elements, we recommend a gradual approach."],["✅","En définitive, la mise en œuvre exigera des moyens supplémentaires.","Ultimately, implementation will require additional resources."]],[["“Il ressort de l'enquête que…” means…",["the survey shows that…","the survey leaves…","the survey ends…"],0],["“Au vu de” means…",["far from","in view of","instead of"],1]]]);
addLs(4,["🤝","Négocier et persuader",["Propose a compromise.","Disagree politely.","Set conditions using the subjunctive."],"<b>Subjunctive</b> after a condition or a desired aim: <i>à condition que… soient</i>, <i>un compromis qui satisfasse</i>. <b>Néanmoins / toutefois</b> mark polite disagreement. <b>Permettez-moi de…</b> = allow me to…",[["🤝","Je vous propose un compromis qui satisfasse les deux parties.","I propose a compromise that satisfies both parties."],["💡","Permettez-moi d'insister sur un point essentiel.","Allow me to stress an essential point."],["⚖️","À condition que les délais soient respectés, nous signerons.","Provided the deadlines are met, we will sign."],["🧩","Je comprends votre position, néanmoins je ne peux y souscrire.","I understand your position; however, I cannot subscribe to it."],["📈","Cela va dans le sens de nos intérêts communs.","That is in line with our common interests."],["🔚","Nous en resterons là pour aujourd'hui.","We will leave it there for today."]],[["“À condition que” is followed by…",["the conditional","the past participle","the subjunctive"],2],["“Néanmoins” means…",["nevertheless","therefore","meanwhile"],0]]]);
addLs(5,["🔬","Nuances lexicales",["Express fine distinctions.","Use tantôt… tantôt…, ni… ni…, sans être + adjective.","Recognise euphemism and understatement."],"<b>Sans être + adjective</b> (concessive). <b>Tantôt… tantôt…</b> = sometimes… sometimes. <b>Ne… ni… ni…</b> = neither… nor. <b>Moins… que…</b> contrasts nuance. <b>Ténu</b> = slight; an <b>euphémisme</b> softens a harsh reality.",[["🎯","Il s'agit moins d'une erreur que d'une omission.","It is less a mistake than an omission."],["🪶","Son propos, sans être faux, reste approximatif.","His remarks, without being false, remain approximate."],["🧭","Tantôt il approuve, tantôt il s'abstient.","Sometimes he approves, sometimes he abstains."],["🔬","Force est d'admettre que la distinction est ténue.","It must be admitted that the distinction is slight."],["🌗","Ce n'est ni tout à fait vrai ni tout à fait faux.","It is neither entirely true nor entirely false."],["🏺","C'est un euphémisme pour dire que la situation est critique.","It is a euphemism for saying the situation is critical."]],[["“Tantôt… tantôt…” means…",["sometimes… sometimes…","soon… later…","both… and…"],0],["“Ténu” means…",["huge","hidden","slight"],2]]]);
addLs(5,["🎤","Rhétorique et éloquence",["Recognise and use rhetorical devices.","Build a persuasive speech with rhythm.","Use que + subjunctive as an exhortation."],"<b>Rhetorical question</b>: <i>Qui d'entre nous…?</i> <b>Non seulement… mais (encore)…</b> <b>Que l'on ne s'y trompe pas</b>: <i>que + subjunctive</i> works as an imperative. Short closing lines create rhythm.",[["🎤","Mesdames et messieurs, permettez-moi de vous poser une question.","Ladies and gentlemen, allow me to ask you a question."],["🔥","Qui d'entre nous n'a jamais douté ?","Who among us has never doubted?"],["⚖️","Non seulement cette mesure est injuste, mais elle est inefficace.","Not only is this measure unfair, but it is ineffective."],["🪞","Que l'on ne s'y trompe pas : l'enjeu dépasse la simple économie.","Make no mistake: the stakes go beyond mere economics."],["🌅","Il est temps, enfin, d'ouvrir un nouveau chapitre.","It is time, at last, to open a new chapter."],["🏁","J'ai dit.","I have spoken."]],[["“Que l'on ne s'y trompe pas” is…",["a question","an exhortation (make no mistake)","a past tense"],1],["“Non seulement… mais…” means…",["neither… nor…","either… or…","not only… but…"],2]]]);
addLs(0,["👕","Couleurs et vêtements",["Name colours and clothes.","Make adjectives agree with the noun.","Ask the price of an item."],"Colours agree with the noun: <i>une robe verte</i>, <i>des chaussures blanches</i>. Most colour adjectives follow the noun. <b>ce / cet / cette / ces</b> = this/that/these: <i>ce pull, cette robe, ces chaussures</i>.",[["👕","Je porte une chemise bleue.","I am wearing a blue shirt."],["👖","Il a un pantalon noir et des chaussures blanches.","He has black trousers and white shoes."],["🧥","Elle met un manteau rouge quand il fait froid.","She puts on a red coat when it is cold."],["🎨","Ma couleur préférée est le vert.","My favourite colour is green."],["🛍️","Cette robe jaune est trop petite.","This yellow dress is too small."],["💶","Combien coûte ce pull gris ?","How much does this grey jumper cost?"]],[["Choose: une robe ___.",["vert","verte","verts"],1],["“Cette” is used with…",["feminine nouns","masculine nouns","plural nouns"],0]]]);
addLs(0,["🥐","Les repas",["Name the meals of the day.","Say what you like and dislike eating.","Use de after a negation."],"<b>Manger</b> (nous mangeons) and <b>boire</b> (je bois, nous buvons) are key verbs. After a negation, <b>du / de la / des → de</b>: <i>Je ne mange pas de viande</i>. <b>Aimer</b> keeps the definite article: <i>j'aime le poisson</i>.",[["🥐","Le matin, je prends un café et du pain.","In the morning I have a coffee and some bread."],["🥗","À midi, nous mangeons une salade.","At noon we eat a salad."],["🍝","Le soir, ma mère prépare des pâtes.","In the evening my mother prepares pasta."],["🍽️","Qu'est-ce que tu veux manger ?","What do you want to eat?"],["😋","J'aime le poisson, mais je n'aime pas la viande.","I like fish but I don't like meat."],["💧","Je bois de l'eau avec chaque repas.","I drink water with every meal."]],[["After a negation: Je ne mange pas ___ viande.",["de","de la","la"],0],["“Le matin” means…",["in the evening","in the morning","at noon"],1]]]);
addLs(1,["🚉","Voyager en train",["Buy a train ticket.","Ask about times and platforms.","Handle delays and changes."],"<b>Devoir</b> + infinitive = must / have to: <i>je dois changer</i>. <b>Aller-retour</b> = return; <b>aller simple</b> = one-way. Questions: <b>à quelle heure…</b>, <b>de quelle voie…</b>.",[["🚉","Un billet aller-retour pour Lyon, s'il vous plaît.","A return ticket to Lyon, please."],["🕐","À quelle heure part le prochain train ?","What time does the next train leave?"],["🛤️","Le train part de la voie quatre.","The train leaves from platform four."],["⏳","Il y a un retard de vingt minutes.","There is a twenty-minute delay."],["🧳","Pouvez-vous m'aider avec ma valise ?","Can you help me with my suitcase?"],["🔄","Je dois changer à Dijon.","I have to change at Dijon."]],[["“Aller simple” means…",["one-way ticket","return ticket","first class"],0],["“Je dois changer” means…",["I must change","I can change","I want to change"],0]]]);
addLs(1,["🏖️","Les vacances",["Tell what you did on holiday.","Describe a place and the weather.","Talk about holiday plans."],"Passé composé with <b>aller</b> uses être: <i>nous sommes allés</i>. Place words: <b>au bord de, près de, loin de</b>. <b>Tous les jours</b> = every day. Preview: <i>il faisait chaud</i> (the imparfait describes the weather in the past).",[["🏖️","L'été dernier, nous sommes allés au bord de la mer.","Last summer we went to the seaside."],["🏨","Nous avons réservé un hôtel près de la plage.","We booked a hotel near the beach."],["📸","J'ai pris beaucoup de photos magnifiques.","I took lots of beautiful photos."],["☀️","Il faisait chaud et le ciel était bleu.","It was hot and the sky was blue."],["🍦","Mes enfants ont mangé des glaces tous les jours.","My children ate ice cream every day."],["✈️","L'année prochaine, je voudrais visiter l'Italie.","Next year I would like to visit Italy."]],[["“Près de” means…",["near","far from","inside"],0],["Complete: Nous ___ allés au bord de la mer.",["avons","sommes","sont"],1]]]);
addLs(2,["📖","Raconter une histoire",["Tell a story in the past.","Use narrative markers.","Combine imparfait and passé composé."],"Narrative markers: <b>d'abord, puis, soudain, pendant que, à ce moment-là, finalement</b>. Imparfait for background (<i>il cherchait</i>), passé composé for events (<i>il a entendu</i>). <b>Sans</b> + infinitive: <i>sans prévenir</i>.",[["📖","Il était une fois un jeune homme qui voulait voyager.","Once upon a time there was a young man who wanted to travel."],["🚪","Un matin, il a quitté son village sans prévenir personne.","One morning he left his village without telling anyone."],["⏰","Soudain, il a entendu un bruit étrange.","Suddenly he heard a strange noise."],["🔍","Pendant qu'il cherchait son chemin, la nuit est tombée.","While he was looking for his way, night fell."],["😮","À ce moment-là, il a compris son erreur.","At that moment he understood his mistake."],["🏁","Finalement, il est rentré chez lui, plus sage qu'avant.","In the end he went home, wiser than before."]],[["“Soudain” means…",["suddenly","slowly","finally"],0],["In “pendant qu'il cherchait”, cherchait is…",["imparfait (background)","passé composé","futur"],0]]]);
addLs(2,["📱","La technologie au quotidien",["Talk about phones, internet and security.","Use dès que and ne… plus.","Use indirect object pronouns (te, lui)."],"<b>Dès que</b> + indicative = as soon as. <b>Ne… plus</b> = no longer / no more: <i>n'a plus de batterie</i>. Indirect pronouns: <b>je t'envoie</b> (to you), <b>je lui envoie</b> (to him / her).",[["📱","Je regarde mon téléphone dès que je me réveille.","I look at my phone as soon as I wake up."],["💻","Grâce à Internet, on peut étudier à distance.","Thanks to the Internet, you can study remotely."],["🔋","Mon portable n'a plus de batterie.","My phone has no battery left."],["🔒","Il faut choisir un mot de passe sécurisé.","You must choose a secure password."],["📶","La connexion est lente dans mon quartier.","The connection is slow in my neighbourhood."],["📩","Je t'envoie le document par e-mail.","I am sending you the document by email."]],[["“Ne… plus” means…",["no longer","never","not yet"],0],["Je ___ envoie le document. (to you)",["te","le","se"],0]]]);
addLs(3,["🎓","Éducation et études",["Discuss education and access to university.","Express certainty and concession.","Use de plus en plus and il ne suffit pas de."],"<b>De plus en plus</b> / <b>de moins en moins</b> = more and more / less and less. <b>Il ne suffit pas de</b> + infinitive = it is not enough to. <b>Je suis convaincu que</b> + indicative (certainty). <b>Certes… mais</b> = concession.",[["🎓","Dans mon pays, l'accès à l'université reste inégal.","In my country, access to university remains unequal."],["📚","Les étudiants sont de plus en plus nombreux à travailler en parallèle.","More and more students work alongside their studies."],["🧪","Pour réussir, il ne suffit pas de mémoriser : il faut comprendre.","To succeed, it is not enough to memorise: you have to understand."],["💬","Je suis convaincu que l'enseignement à distance a de l'avenir.","I am convinced that distance learning has a future."],["⚖️","Certes, il comporte des limites, mais il offre de la flexibilité.","Admittedly it has limits, but it offers flexibility."],["🎯","L'objectif est de former des citoyens autonomes et critiques.","The aim is to train autonomous, critical citizens."]],[["“De plus en plus” means…",["more and more","less and less","even more than"],0],["After “je suis convaincu que” use…",["the indicative","the subjunctive","the conditional only"],0]]]);
addLs(3,["🏥","Santé publique et société",["Discuss public health issues.","Use faute de, permettre de, faire face à.","Use the subjunctive after il est essentiel que."],"<b>Faire face à</b> = to face. <b>Permettre de</b> + infinitive. <b>Faute de</b> + noun = for lack of. <b>Il est essentiel que</b> + subjunctive: <i>que chacun ait</i> (avoir → ait). <b>Il est recommandé de</b> + infinitive.",[["🏥","Le système de santé fait face à une pénurie de personnel.","The health system is facing a staff shortage."],["💉","La vaccination permet de prévenir de nombreuses maladies.","Vaccination helps prevent many diseases."],["🥦","Il est recommandé de manger cinq fruits et légumes par jour.","It is recommended to eat five portions of fruit and vegetables a day."],["🧠","La santé mentale reste encore un sujet tabou.","Mental health is still a taboo subject."],["📉","Faute de moyens, de nombreux hôpitaux ferment des services.","For lack of resources, many hospitals are closing departments."],["🤝","Il est essentiel que chacun ait accès aux soins.","It is essential that everyone has access to care."]],[["“Faute de moyens” means…",["for lack of resources","thanks to resources","with all the means"],0],["Complete: Il faut que chacun ___ accès aux soins.",["a","ait","aura"],1]]]);
addLs(4,["⚖️","Droit et citoyenneté",["Understand basic legal and civic vocabulary.","Use the passive in formal texts.","Discuss rights and duties."],"<b>Nul n'est censé…</b> = nobody is supposed to… (formal negative). Passive: <i>a été adopté, a été jugé</i>. Legal register: <i>le prévenu, les faits, adopter un texte</i>. <b>Droits et devoirs</b> is a fixed pair.",[["⚖️","Nul n'est censé ignorer la loi.","Ignorance of the law is no excuse."],["🗳️","Le droit de vote est un acte citoyen fondamental.","The right to vote is a fundamental civic act."],["📜","Ce texte a été adopté à une large majorité.","This text was adopted by a large majority."],["🧑‍⚖️","Le prévenu a été jugé coupable des faits qui lui étaient reprochés.","The defendant was found guilty of the charges against him."],["🏛️","Les pouvoirs législatif, exécutif et judiciaire sont distincts.","The legislative, executive and judicial powers are separate."],["🤝","Chaque citoyen a des droits, mais aussi des devoirs.","Every citizen has rights but also duties."]],[["“Le prévenu” is…",["the defendant","the judge","the witness"],0],["“Les pouvoirs sont distincts” means…",["powers are separate","powers are equal","powers are hidden"],0]]]);
addLs(4,["🔬","Sciences et éthique",["Debate scientific progress and ethics.","Use il importe que + subjunctive.","Use formal negation with ne saurait."],"<b>Il importe que</b> + subjunctive (formal). <b>Ne saurait</b> (conditional of savoir) = cannot, formal negation: <i>ne saurait se limiter</i>. <b>Sans</b> + noun = without. <b>Concilier… et…</b> = to reconcile… and….",[["🔬","Les avancées de la génétique soulèvent des questions éthiques majeures.","Advances in genetics raise major ethical questions."],["⚠️","Il importe que la recherche demeure encadrée.","It is important that research remains regulated."],["🤖","L'essor de l'intelligence artificielle bouleverse le marché du travail.","The rise of artificial intelligence is disrupting the job market."],["🧭","Sans garde-fous, le progrès peut se retourner contre l'humain.","Without safeguards, progress can turn against humanity."],["🗣️","Le débat ne saurait se limiter aux seuls experts.","The debate cannot be limited to experts alone."],["🌱","Il s'agit de concilier innovation et responsabilité.","It is a matter of reconciling innovation and responsibility."]],[["“Un garde-fou” is…",["a safeguard","a madman","a gatekeeper"],0],["“Ne saurait” expresses…",["a formal “cannot”","a future plan","a past habit"],0]]]);
addLs(5,["🏛️","Histoire et mémoire",["Discuss history and collective memory.","Use à l'aune de, tel est, sans + infinitive.","Build elegant parallel structures."],"<b>À l'aune de</b> = by the standard of. <b>Pans entiers</b> = whole areas. <b>Sans + infinitive</b> (<i>sans figer, sans instrumentaliser</i>) creates a parallel structure. <b>Tel est…</b> introduces a conclusion.",[["🏛️","L'histoire n'est pas seulement le récit du passé, elle en est aussi la construction.","History is not only the account of the past; it is also its construction."],["🕯️","Le devoir de mémoire s'impose à chaque génération.","The duty of remembrance falls on every generation."],["📜","Les archives, longtemps négligées, éclairent aujourd'hui des pans entiers du passé.","The archives, long neglected, now shed light on whole areas of the past."],["⚖️","On ne saurait juger le passé à l'aune des seules valeurs présentes.","One cannot judge the past solely by present-day values."],["🌫️","La mémoire collective est tantôt fidèle, tantôt déformée.","Collective memory is sometimes faithful, sometimes distorted."],["🧭","Tel est l'enjeu : transmettre sans figer, commémorer sans instrumentaliser.","That is the challenge: to pass on without freezing, to commemorate without exploiting."]],[["“À l'aune de” means…",["by the standard of","in front of","far from"],0],["“Tel est l'enjeu” means…",["That is what is at stake","Such is the game","This is the risk of failing"],0]]]);
addLs(5,["📚","Comparer deux textes",["Compare two authors' positions.","Use alors que, l'un comme l'autre, hormis.","Qualify an apparent opposition."],"<b>Alors que</b> = whereas (contrast). <b>L'un comme l'autre</b> = both. <b>S'accorder sur / diverger sur</b>. <b>Hormis</b> = except. <b>Miser sur</b> = to rely on. <b>Loin de s'exclure</b>: loin de + infinitive.",[["📚","Les deux auteurs s'accordent sur le diagnostic, mais divergent sur les remèdes.","Both authors agree on the diagnosis but differ on the remedies."],["⚖️","Alors que le premier privilégie la raison, le second mise sur l'émotion.","Whereas the first favours reason, the second relies on emotion."],["🪞","L'un comme l'autre dénoncent l'hypocrisie sociale.","Both denounce social hypocrisy."],["🧩","Ces deux démarches, loin de s'exclure, se complètent.","These two approaches, far from excluding each other, complement each other."],["🔎","On peut toutefois nuancer cette opposition apparente.","However, this apparent opposition can be qualified."],["🏁","En somme, tout les rapproche, hormis le ton.","In short, everything brings them together except the tone."]],[["“Alors que” expresses…",["contrast (whereas)","cause","purpose"],0],["“Hormis” means…",["except","above","soon"],0]]]);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const simil=(a,b)=>{a=norm(a);b=norm(b);return Math.round((1-lev(a,b)/Math.max(a.length,b.length,1))*100)};
function bindMic(){const b=el("mic");if(!b)return;
  b.onclick=()=>{const out=el("pres"),tgt=cl().scenes[pl.i][1];
    if(!SR){out.innerHTML=`<span class="mu">Speech recognition is not available in this browser or page. Try Chrome, or repeat aloud after “Say slowly”.</span>`;return}
    stopPl();let rec;try{rec=new SR()}catch(e){out.textContent="Microphone unavailable here.";return}
    rec.lang="fr-FR";rec.maxAlternatives=3;rec.interimResults=false;out.innerHTML=`<span class="mu">🎤 Listening… say: <b>${esc(tgt)}</b></span>`;
    rec.onresult=ev=>{const alts=[...ev.results[0]].map(a=>a.transcript);let best=alts[0],sc=0;alts.forEach(a=>{const s=simil(a,tgt);if(s>=sc){sc=s;best=a}});
      const heard=new Set(norm(best).split(" ")),words=tgt.split(" ").map(w=>`<span style="color:var(--${heard.has(norm(w))?"ok":"bad"})">${esc(w)}</span>`).join(" ");
      out.innerHTML=`<div class="card"><div class="big" style="font-size:32px;color:var(--${sc>=80?"ok":sc>=55?"ac":"bad"})">${sc}%</div><div>${words}</div><div class="mu">I heard: “${esc(best)}”</div><div>${sc>=80?"✅ Très bien !":sc>=55?"👍 Close. Listen again, then repeat slowly.":"🔁 Try again after listening with “Say slowly”."}</div></div>`;touch()};
    rec.onerror=ev=>{out.innerHTML=`<span class="mu">${ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Microphone access is blocked for this page. Allow the microphone in your browser, or open the page in Chrome.":"Could not hear you ("+ev.error+"). Try again."}</span>`};
    try{rec.start()}catch(e){}}}

const GR=[["A1",[["Articles","<b>le / la / l' / les</b> = the · <b>un / une / des</b> = a, some. Learn the gender with each noun: <i>le livre, la table</i>."],["Être and avoir","<i>je suis, tu es, il est, nous sommes, vous êtes, ils sont</i> · <i>j'ai, tu as, il a, nous avons, vous avez, ils ont</i>."],["Negation","<b>ne … pas</b> around the verb: <i>Je ne parle pas anglais.</i> Before a vowel: <i>Je n'ai pas…</i>. In speech, <i>ne</i> is often dropped."],["Asking questions","Intonation (<i>Tu viens ?</i>), <b>est-ce que</b> (<i>Est-ce que tu viens ?</i>), or inversion, more formal (<i>Viens-tu ?</i>)."],["Adjectives","Agree in gender and number: <i>petit, petite, petits, petites</i>. Most follow the noun; many short common ones (beau, petit, grand, bon, jeune) come before: <i>un petit garçon</i>."]]],
["A2",[["Passé composé","avoir/être + past participle: <i>j'ai mangé</i>. Movement and reflexive verbs take être and agree: <i>elle est partie</i>, <i>ils se sont levés</i>."],["Futur proche","aller + infinitive: <i>je vais partir</i>."],["Direct object pronouns","<b>le, la, l', les</b> replace the object: <i>Je mange la pomme → Je la mange.</i> In the passé composé they go before the auxiliary and the participle agrees: <i>Je l'ai mangée.</i>"],["Comparing","<b>plus / moins / aussi + adjective + que</b>. Superlative: <i>le plus grand</i>. Irregular: <i>meilleur</i> (better, adjective), <i>mieux</i> (better, adverb)."],["Partitive articles","<b>du, de la, de l', des</b> for “some”. After a quantity use <b>de</b>: <i>beaucoup de pain</i>."]]],
["B1",[["Imparfait vs passé composé","Imparfait: habits, descriptions, background. Passé composé: specific completed events. <i>Il pleuvait quand je suis sorti.</i>"],["Futur simple and conditional","Futur: infinitive + ai, as, a, ons, ez, ont. Conditional: same stem + ais, ais, ait, ions, iez, aient. <b>Si + présent → futur</b>; <b>si + imparfait → conditionnel</b>."],["Pronouns y and en","<b>y</b> replaces à + place/thing: <i>J'y vais.</i> <b>en</b> replaces de + noun or a quantity: <i>J'en veux deux.</i>"],["Relative pronouns","<b>qui</b> (subject), <b>que</b> (object), <b>où</b> (place/time): <i>le livre que j'ai lu</i>."]]],
["B2",[["Subjunctive","After necessity, doubt, emotion, concession: <i>il faut que, je doute que, bien que, pour que</i>. Irregular: être → sois, avoir → aie, aller → aille, faire → fasse."],["Passive voice","être + participle (+ par): <i>La loi a été votée.</i> The participle agrees with the subject."],["Dont and lequel","<b>dont</b> replaces de + noun: <i>le livre dont je parle</i>. <b>lequel/laquelle</b> after prepositions: <i>le sujet sur lequel je travaille</i> (à + lequel = auquel, de + lequel = duquel)."],["Plus-que-parfait and 3rd conditional","avoir/être in the imparfait + participle: <i>j'avais fini</i>. <b>Si + plus-que-parfait → conditionnel passé</b>: <i>Si j'avais su, je serais venu.</i>"]]],
["C1",[["Concession and cause","<i>certes… mais, il n'en demeure pas moins que, bien que + subj.</i> · <i>dans la mesure où, d'autant que, puisque</i>."],["Reported speech","Past reporting verb shifts tenses: présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel. <i>Il a dit qu'il viendrait.</i>"],["Gérondif and participe présent","<b>en + -ant</b> = while / by: <i>en travaillant</i>. The participe présent alone describes or explains in writing: <i>les étudiants travaillant ici</i>."],["Mood after opinion verbs","Negative or questioning opinion verbs often take the subjunctive: <i>Je ne pense pas que ce soit vrai.</i>"]]],
["C2",[["Passé simple","Literary narrative tense: <i>il ouvrit, elle dit, ils virent</i>. Recognise it in novels; do not use it in speech."],["Imparfait du subjonctif","<i>qu'il vînt, qu'elle osât</i>: formal literary register; recognise it, rarely produce it."],["Inversion","After <i>à peine, jamais, aussi (hence), peut-être</i> at sentence start: <i>À peine eut-il fini que…</i>, <i>Aussi convient-il de…</i>."],["Ne explétif","Some verbs of fear/precaution allow a pleonastic ne in formal writing: <i>Je crains qu'il ne vienne.</i> It adds no negative meaning."]]]];

function recsView(){$.innerHTML=`<button class="g" id="bk">← Back</button><h1>🎞 Recordings</h1><div class="mu">${esc(RC.name||"")}</div><div class="card"><div id="recs" class="mu">Loading…</div></div>`;el("bk").onclick=()=>{view="home";render()};loadRecs(RC.id,"recs")}

const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
let CL=null;
const sig=(kind,to,payload)=>api("/rest/v1/signals",{m:"POST",h:{Prefer:"return=minimal"},body:{room:CL.room,from_id:AUTH.user.id,to_id:to||null,kind,payload:payload||{}}});
const nameOf=u=>{if(!CL.host)return "Lecturer";const c=LC.classes.find(x=>x.id===CL.room),e=c&&c.enrollments.find(x=>x.student_id===u);return(e&&e.profiles&&e.profiles.full_name)||"Student"};
function tile(id,label,stream,muted){let t=document.getElementById("t_"+id);if(!t){t=document.createElement("div");t.className="vt";t.id="t_"+id;t.innerHTML='<video autoplay playsinline></video><div class="vl"></div>';el("vg").appendChild(t)}const v=t.querySelector("video");v.muted=!!muted;if(v.srcObject!==stream)v.srcObject=stream;t.querySelector(".vl").textContent=label}
function cstat(t){if(CL){CL.status=t;const e=el("cst");if(e)e.textContent=t}}
function callView(){if(!CL){view="home";return render()}
  $.innerHTML=`<div class="top"><b>📹 ${esc(CL.name)}</b><span class="mu" id="cst">${esc(CL.status)}</span></div><div id="vg" class="vgrid"></div>

  tile("me",(CL.host?"You (lecturer)":"You"),CL.stream,true);
  CL.pcs.forEach((pc,u)=>{if(CL.remote[u])tile(u,nameOf(u),CL.remote[u],false)});
  el("cmic").onclick=()=>{const t=CL.stream.getAudioTracks();t.forEach(x=>x.enabled=!x.enabled);el("cmic").textContent=t[0]&&t[0].enabled?"🎤 Mic on":"🔇 Mic off"};
  const cam=el("ccam");if(cam)cam.onclick=()=>{const t=CL.stream.getVideoTracks();t.forEach(x=>x.enabled=!x.enabled);cam.textContent=t[0]&&t[0].enabled?"📷 Camera on":"🚫 Camera off"};

async function startCall(room,name,host,voice){if(!AUTH){alert("Please sign in first.");return}if(!window.RTCPeerConnection){alert("This browser does not support live calls. Try Chrome or Safari.");return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:voice?false:{width:{ideal:640},height:{ideal:360},frameRate:{ideal:15}}})}catch(e){alert("Camera or microphone is blocked or unavailable. Allow access in your browser settings, or choose voice only.");return}
  stopPl();stopClip();CL={room,name,host,stream,video:!voice,pcs:new Map(),remote:{},pend:{},last:0,run:true,status:host?"Starting…":"Waiting for the lecturer to start…",rec:null,connected:false};view="call";render();
  try{if(host){await api("/rest/v1/signals?room=eq."+room,{m:"DELETE",h:{Prefer:"return=minimal"}}).catch(()=>{});await sig("hello",null);cstat("Live · waiting for students")}else{await sig("join",null);CL.jt=setInterval(()=>{if(CL&&CL.run&&!CL.connected)sig("join",null).catch(()=>{})},6000)}}catch(e){cstat("Could not reach the server: "+e.message)}
  pollSig()}
async function pollSig(){if(!CL||!CL.run)return;const c=CL;
  try{const rows=await api("/rest/v1/signals?room=eq."+c.room+"&id=gt."+c.last+"&order=id.asc&limit=200");for(const s of rows){c.last=Math.max(c.last,s.id);if(s.from_id===AUTH.user.id)continue;try{await onSig(s)}catch(e){}}}catch(e){}
  if(CL===c&&c.run)setTimeout(pollSig,1200)}
function mkPeer(u){const old=CL.pcs.get(u);if(old){try{old.close()}catch(e){}}const pc=new RTCPeerConnection(ICE);pc._t=Date.now();pc._q=[];CL.pcs.set(u,pc);CL.stream.getTracks().forEach(t=>pc.addTrack(t,CL.stream));
  pc.onicecandidate=e=>{if(e.candidate)sig("ice",u,{c:e.candidate.toJSON()}).catch(()=>{})};
  pc.ontrack=e=>{const st=e.streams[0]||new MediaStream([e.track]);CL.remote[u]=st;tile(u,nameOf(u),st,false);if(CL.rec&&CL.rec.on)CL.rec.add(st);if(!CL.host){CL.connected=true;cstat("Connected")}else cstat("Live · "+CL.pcs.size+" student"+(CL.pcs.size===1?"":"s"))};
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==="failed"){cstat(CL.host?nameOf(u)+": connection failed (network). Ask them to try voice only.":"Connection failed. Check your network, or leave and rejoin with voice only.")}if(s==="closed"&&CL&&CL.pcs.get(u)===pc){const t=document.getElementById("t_"+u);if(t)t.remove()}};return pc}
async function addCand(pc,c){if(!c)return;if(pc.remoteDescription)await pc.addIceCandidate(c).catch(()=>{});else pc._q.push(c)}
async function flushCand(pc){while(pc._q.length)await pc.addIceCandidate(pc._q.shift()).catch(()=>{})}
async function onSig(s){const p=s.payload||{},u=s.from_id,k=s.kind,me=AUTH.user.id;
  if(CL.host){
    if(k==="join"){const old=CL.pcs.get(u);if(old&&(old.connectionState==="connected"||(Date.now()-old._t<12000&&old.connectionState!=="failed")))return;
      const pc=mkPeer(u);const off=await pc.createOffer();await pc.setLocalDescription(off);await sig("offer",u,{sdp:pc.localDescription.toJSON()})}
    else if(k==="answer"){const pc=CL.pcs.get(u);if(pc&&pc.signalingState==="have-local-offer"){await pc.setRemoteDescription(p.sdp);await flushCand(pc)}}
    else if(k==="ice"&&s.to_id===me){const pc=CL.pcs.get(u);if(pc)await addCand(pc,p.c)}
    else if(k==="leave"){closePeer(u)}
  }else{
    if(k==="hello"){await sig("join",null)}
    else if(k==="offer"&&s.to_id===me){const pc=mkPeer(u);await pc.setRemoteDescription(p.sdp);await flushCand(pc);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await sig("answer",u,{sdp:pc.localDescription.toJSON()});cstat("Connecting…")}
    else if(k==="ice"&&s.to_id===me){const pc=CL.pcs.get(u);if(pc)await addCand(pc,p.c)}
    else if(k==="bye"){cstat("The lecturer ended the class.");const m=el("cmsg");if(m)m.textContent="The lecturer ended the class. You can leave now."}}}
function closePeer(u){const pc=CL.pcs.get(u);if(pc){try{pc.close()}catch(e){}}CL.pcs.delete(u);delete CL.remote[u];const t=document.getElementById("t_"+u);if(t)t.remove();if(CL.host)cstat("Live · "+CL.pcs.size+" student"+(CL.pcs.size===1?"":"s"))}
async function endCall(){const c=CL;if(!c)return;c.run=false;clearInterval(c.jt);
  try{if(c.host){recStop();await sig("bye",null).catch(()=>{});await api("/rest/v1/signals?room=eq."+c.room,{m:"DELETE",h:{Prefer:"return=minimal"}}).catch(()=>{})}else await sig("leave",null).catch(()=>{})}catch(e){}
  c.pcs.forEach(pc=>{try{pc.close()}catch(e){}});c.stream.getTracks().forEach(t=>t.stop());CL=null;
  if(c.host){view="cls";classView()}else{view="home";render()}}
/* ---- recording (lecturer): mixed audio + lecturer video, saved in ~8-minute parts ---- */
function recStart(){const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),dest=ac.createMediaStreamDestination(),R={ac,dest,part:0,on:true,stamp:Date.now(),title:"Live class "+new Date().toLocaleString(),cls:CL.room,add:null};
  R.add=st=>{try{if(st.getAudioTracks().length)ac.createMediaStreamSource(st).connect(dest)}catch(e){}};R.add(CL.stream);Object.values(CL.remote).forEach(R.add);CL.rec=R;recSeg(R)}
function recSeg(R){const vt=CL?CL.stream.getVideoTracks():[],ms=new MediaStream([...vt,...R.dest.stream.getAudioTracks()]),has=vt.length>0,list=has?["video/webm;codecs=vp8,opus","video/webm","video/mp4"]:["audio/webm;codecs=opus","audio/webm","audio/mp4"],mime=list.find(m=>MediaRecorder.isTypeSupported(m))||"";
  let mr;try{mr=new MediaRecorder(ms,Object.assign({},mime?{mimeType:mime}:{},{audioBitsPerSecond:48000},has?{videoBitsPerSecond:350000}:{}))}catch(e){cstat("Recording is not supported on this browser.");R.on=false;return}
  const ch=[];R.mr=mr;mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  mr.onstop=async()=>{clearTimeout(R.timer);const part=++R.part,type=(mime||(has?"video/webm":"audio/webm")).split(";")[0],blob=new Blob(ch,{type});if(R.on&&CL&&CL.run)recSeg(R);else R.on=false;if(blob.size>0)await recUpload(R,blob,type,part)};
  mr.start(1000);R.timer=setTimeout(()=>{try{mr.stop()}catch(e){}},8*60*1000)}
function recStop(){const R=CL&&CL.rec;if(!R||!R.mr)return;R.on=false;clearTimeout(R.timer);try{if(R.mr.state!=="inactive")R.mr.stop()}catch(e){}}
async function recUpload(R,blob,type,part){const ext=type==="video/mp4"?"mp4":"webm",path=R.cls+"/"+R.stamp+"-p"+part+"."+ext;
  try{await api("/storage/v1/object/recordings/"+path,{m:"POST",h:{"Content-Type":type,"x-upsert":"true"},body:blob});await api("/rest/v1/recordings",{m:"POST",h:{Prefer:"return=minimal"},body:{class_id:R.cls,title:R.title,part,path,created_by:AUTH.user.id}});const m=el("cmsg");if(m)m.textContent="Saved recording part "+part+" ✓"}catch(e){const m=el("cmsg");if(m)m.textContent="Could not save recording part "+part+": "+e.message+". Check your connection."}}
