name: French Intelligence checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "features/french-intelligence.js"
      - "features/french-intelligence-core-v1.mjs"
      - "features/french-section12-rules.mjs"
      - "features/french-conjugation-paradigms.mjs"
      - "features/french-intelligence-compat.mjs"
      - "scripts/check-french-intelligence-core.mjs"
      - "scripts/check-french-intelligence-correctness.mjs"
      - "scripts/check-french-intelligence-parity.mjs"
      - "scripts/check-golden-v3.mjs"
      - "scripts/generate-golden-v3.mjs"
      - "index.html"
      - "sw.js"
      - "docs/french-intelligence-linguistic-matrix.md"
      - "scripts/check-section12-regressions.mjs"
      - "scripts/check-french-intelligence.mjs"
      - "scripts/characterize-french-intelligence.mjs"
      - "scripts/check-french-intelligence.browser.mjs"
      - "scripts/check-french-intelligence.ui-parity.mjs"
      - "scripts/check-writing-compat-parity.mjs"
      - "tests/fixtures/french-intelligence-legacy.html"
      - "tests/fixtures/french-intelligence-compat.html"
      - "scripts/generate-golden.mjs"
      - "scripts/check-golden-integrity.mjs"
      - "tests/golden/legacy-v1.json"
      - "tests/golden/legacy-v1.sha256"
      - "tests/golden/legacy-v3.json"
      - "tests/golden/legacy-v3.sha256"
      - ".github/workflows/legacy-golden-integrity.yml"
      - "scripts/build-teacher-ledger.mjs"
      - "scripts/check-teacher-ledger.mjs"
      - "scripts/export-teacher-form.mjs"
      - "tests/teacher-ledger.json"
      - "docs/teacher-ledger.schema.md"
      - "docs/teacher-review-form.csv"
      - "docs/section-12-closeout.md"
      - ".github/workflows/french-intelligence-check.yml"
  push:
    branches:
      - feat/french-intelligence-engine
      - feat/wire-section12-writing
    paths:
      - "features/french-intelligence.js"
      - "features/french-intelligence-core-v1.mjs"
      - "features/french-section12-rules.mjs"
      - "features/french-conjugation-paradigms.mjs"
      - "features/french-intelligence-compat.mjs"
      - "scripts/check-french-intelligence-core.mjs"
      - "scripts/check-french-intelligence-correctness.mjs"
      - "scripts/check-french-intelligence-parity.mjs"
      - "scripts/check-golden-v3.mjs"
      - "scripts/generate-golden-v3.mjs"
      - "index.html"
      - "sw.js"
      - "docs/french-intelligence-linguistic-matrix.md"
      - "scripts/check-section12-regressions.mjs"
      - "scripts/check-french-intelligence.mjs"
      - "scripts/check-french-intelligence.browser.mjs"
      - "scripts/check-french-intelligence.ui-parity.mjs"
      - "scripts/check-writing-compat-parity.mjs"
      - "tests/fixtures/french-intelligence-legacy.html"
      - "tests/fixtures/french-intelligence-compat.html"
      - "scripts/generate-golden.mjs"
      - "scripts/check-golden-integrity.mjs"
      - "tests/golden/legacy-v1.json"
      - "tests/golden/legacy-v1.sha256"
      - "tests/golden/legacy-v3.json"
      - "tests/golden/legacy-v3.sha256"
      - ".github/workflows/legacy-golden-integrity.yml"
      - "scripts/build-teacher-ledger.mjs"
      - "scripts/check-teacher-ledger.mjs"
      - "scripts/export-teacher-form.mjs"
      - "tests/teacher-ledger.json"
      - "docs/teacher-ledger.schema.md"
      - "docs/teacher-review-form.csv"
      - "docs/section-12-closeout.md"
      - ".github/workflows/french-intelligence-check.yml"

permissions:
  contents: read

jobs:
  syntax-and-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required repository tree
        shell: bash
        run: |
          set -euo pipefail
          required=(
            features/french-intelligence.js
            features/french-intelligence-core-v1.mjs
            features/french-intelligence-compat.mjs
            features/french-data.mjs
            features/french-section12-rules.mjs
            scripts/generate-golden.mjs
            scripts/check-golden-integrity.mjs
            scripts/check-golden-v3.mjs
            scripts/check-writing-compat-parity.mjs
            tests/golden/legacy-v1.json
          )
          missing=()
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then missing+=("$path"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required repository files:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "PASS: all required repository files are present."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check engine JavaScript syntax
        run: node --check features/french-intelligence.js
      - name: Check pure core syntax
        run: node --check features/french-intelligence-core-v1.mjs
      - name: Check DOM-free core
        run: node scripts/check-french-intelligence-core.mjs
      - name: Check Section 14a correctness
        run: node scripts/check-french-intelligence-correctness.mjs
      - name: Check approved golden v2 ledger and checksum
        run: node scripts/check-golden-v2.mjs
      - name: Check approved golden v3 scope and checksum
        run: node scripts/check-golden-v3.mjs
      - name: Check engine integration contract
        run: node scripts/check-french-intelligence.mjs
      - name: Check Section 12 lookup and hint regressions
        run: node scripts/check-section12-regressions.mjs
      - name: Check exact legacy parity
        run: node scripts/check-french-intelligence-parity.mjs
      - name: Check legacy method characterization
        run: node scripts/characterize-french-intelligence.mjs
      - name: Teacher ledger validation and CSV export (report-only)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/build-teacher-ledger.mjs
          build_status=$?
          node scripts/check-teacher-ledger.mjs
          check_status=$?
          node scripts/export-teacher-form.mjs
          export_status=$?
          echo "Teacher ledger report-only exit codes: build=$build_status check=$check_status export=$export_status"
          echo "Teacher review remains pending; this step does not block existing checks."
          exit 0
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/french-academy-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/french-academy-http.log
          exit 1
      - name: Verify the app in desktop and mobile Chromium
        run: node scripts/check-french-intelligence.browser.mjs
      - name: Compare legacy and compatibility browser UI
        run: node scripts/check-french-intelligence.ui-parity.mjs
      - name: Verify Writing API and UI parity against main golden and 639-input safety net
        run: node scripts/check-writing-compat-parity.mjs

  golden-reproducibility:
    name: Reproduce legacy golden in memory
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate and compare exact bytes without writing files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-golden.mjs --stdout | cmp - tests/golden/legacy-v1.json
          echo "PASS: in-memory legacy golden is byte-identical to tests/golden/legacy-v1.json; no generated files were written."
