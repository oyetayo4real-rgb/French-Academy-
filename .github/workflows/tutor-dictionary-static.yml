name: Tutor and dictionary static checks

on:
  push:
    branches:
      - fix/nexus-tutor-dictionary-reliability
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/tutor/index.ts"
      - "features/ai-classroom.js"
      - "scripts/check-tutor-dictionary.mjs"
      - ".github/workflows/tutor-dictionary-static.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused Tutor and dictionary regression checks
        run: node scripts/check-tutor-dictionary.mjs
