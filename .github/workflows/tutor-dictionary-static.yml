name: Tutor and dictionary reliability tests

on:
  push:
    branches:
      - fix/nexus-tutor-dictionary-reliability
      - nexus/local-isolated-staging
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/tutor/index.ts"
      - "supabase/functions/tutor/tutor.test.ts"
      - "features/ai-classroom.js"
      - "scripts/check-tutor-dictionary.mjs"
      - "scripts/check-schema-snapshot.mjs"
      - "scripts/check-reconstructed-baseline.mjs"
      - "docs/schema-snapshot/**"
      - "supabase/reconstructed-local-only/**"
      - ".github/workflows/tutor-dictionary-static.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused frontend and source assertions
        run: node scripts/check-tutor-dictionary.mjs
      - name: Validate captured schema snapshot
        run: node scripts/check-schema-snapshot.mjs
      - name: Audit reconstructed baseline table grants
        run: node scripts/check-reconstructed-baseline.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run actual TypeScript helper tests with mocked providers
        run: deno test --allow-env=AI_PROVIDER,GEMINI_API_KEY supabase/functions/tutor/tutor.test.ts
