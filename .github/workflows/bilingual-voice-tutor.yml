name: Bilingual voice tutor validation

on:
  push:
    branches:
      - feat/bilingual-voice-tutor
    paths:
      - "features/ai-classroom.js"
      - "features/ai-classroom.css"
      - "scripts/check-tutor-retry-browser.mjs"
      - "supabase/functions/tutor-v2/index.ts"
      - "supabase/functions/tutor-v2/index.test.ts"
      - "supabase/migrations/20261118181000_tutor_learning_memory.sql"
      - "index.html"
      - ".github/workflows/bilingual-voice-tutor.yml"
  pull_request:
    paths:
      - "features/ai-classroom.js"
      - "features/ai-classroom.css"
      - "scripts/check-tutor-retry-browser.mjs"
      - "supabase/functions/tutor-v2/index.ts"
      - "supabase/functions/tutor-v2/index.test.ts"
      - "index.html"
      - ".github/workflows/bilingual-voice-tutor.yml"

permissions:
  contents: read

concurrency:
  group: bilingual-voice-tutor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: french_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d french_academy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check features/ai-classroom.js
          node --check scripts/check-tutor-retry-browser.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tutor backend tests
        run: deno test supabase/functions/tutor-v2/index.test.ts

      - name: Validate learning-memory migration and database access boundaries
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: french_academy_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          INSERT INTO auth.users (id) VALUES ('00000000-0000-4000-8000-000000000001');
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261118181000_tutor_learning_memory.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.tutor_learning_memory (user_id, enabled)
          VALUES ('00000000-0000-4000-8000-000000000001', true);
          SET ROLE service_role;
          SELECT public.tutor_memory_record_interaction(
            '00000000-0000-4000-8000-000000000001',
            'A2',
            'practice',
            ARRAY['subjunctive', 'subjunctive', 'unapproved_raw_text']
          );
          RESET ROLE;
          DO $
          DECLARE
            saved public.tutor_learning_memory%ROWTYPE;
          BEGIN
            SELECT * INTO saved
            FROM public.tutor_learning_memory
            WHERE user_id = '00000000-0000-4000-8000-000000000001';
            IF saved.interaction_count <> 1
              OR saved.cefr_level <> 'A2'
              OR saved.topic_counts ->> 'subjunctive' <> '2'
              OR saved.topic_counts ? 'unapproved_raw_text'
              OR saved.mode_counts ->> 'practice' <> '1' THEN
              RAISE EXCEPTION 'learning memory aggregation or allow-list check failed';
            END IF;
          END;
          $;
          SQL
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT * FROM public.tutor_learning_memory;" >/dev/null 2>&1; then
            echo "Authenticated users must not access the server-only memory table."
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT public.tutor_memory_record_interaction('00000000-0000-4000-8000-000000000001', 'A2', 'chat', ARRAY[]::text[]);" >/dev/null 2>&1; then
            echo "Authenticated users must not execute the memory recorder."
            exit 1
          fi
          echo "PASS: migration, allow-listed counters, RLS, and server-only grants"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/french-academy-server.log 2>&1 &
          echo $! >/tmp/french-academy-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/french-academy-server.log
          exit 1

      - name: Run tutor voice and retry browser tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/check-tutor-retry-browser.mjs
