name: Generate legacy French Intelligence golden baseline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-golden-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate golden baseline from immutable legacy source
        run: node scripts/generate-golden.mjs
      - name: Commit golden JSON and SHA together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/legacy-v1.json tests/golden/legacy-v1.sha256
          if git diff --cached --quiet; then
            echo "Golden baseline is unchanged; no commit is needed."
            exit 0
          fi
          git commit -m "APPROVED GOLDEN UPDATE: regenerate legacy-v1 baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
