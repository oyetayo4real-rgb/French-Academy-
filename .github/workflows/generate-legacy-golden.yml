name: Generate legacy French Intelligence golden baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feat/french-intelligence-engine
    paths:
      - .github/golden-run-request.txt

permissions:
  contents: write

concurrency:
  group: legacy-golden-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard existing golden baseline
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/contents/tests/golden/legacy-v1.json?ref=${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Golden baseline already exists; refusing to regenerate"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out complete history
        if: steps.guard.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        if: steps.guard.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate golden baseline from immutable legacy source
        if: steps.guard.outputs.exists != 'true'
        run: node scripts/generate-golden.mjs
      - name: Commit golden JSON and SHA together
        if: steps.guard.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/legacy-v1.json tests/golden/legacy-v1.sha256
          if git diff --cached --quiet; then
            echo "Golden baseline is unchanged; no commit is needed."
            exit 0
          fi
          git commit -m "APPROVED GOLDEN UPDATE: regenerate legacy-v1 baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
