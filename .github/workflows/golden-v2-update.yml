name: Section 14a approved golden v2
on:
  push:
    branches:
      - feat/french-intelligence-engine
    paths:
      - "features/french-intelligence-core-v1.mjs"
      - "features/french-intelligence-compat.mjs"
      - "features/french-conjugation-paradigms.mjs"
      - "scripts/generate-golden-v2.mjs"
      - "scripts/golden-v2-utils.mjs"
      - "scripts/check-golden-v2.mjs"
      - "scripts/check-french-intelligence-correctness.mjs"
      - "scripts/check-french-intelligence-parity.mjs"
      - "scripts/check-french-intelligence.ui-parity.mjs"
      - "tests/golden/legacy-v2.json"
      - "tests/golden/legacy-v2.sha256"
      - "docs/golden-changes.md"
      - ".github/workflows/golden-v2-update.yml"
  pull_request:
    paths:
      - "features/french-intelligence-core-v1.mjs"
      - "features/french-intelligence-compat.mjs"
      - "features/french-conjugation-paradigms.mjs"
      - "scripts/generate-golden-v2.mjs"
      - "scripts/golden-v2-utils.mjs"
      - "scripts/check-golden-v2.mjs"
      - "scripts/check-french-intelligence-correctness.mjs"
      - "scripts/check-french-intelligence-parity.mjs"
      - "scripts/check-french-intelligence.ui-parity.mjs"
      - "tests/golden/legacy-v2.json"
      - "tests/golden/legacy-v2.sha256"
      - "docs/golden-changes.md"
permissions:
  contents: write
jobs:
  approve-update:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[generate-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate v2 and change ledger
        run: node scripts/generate-golden-v2.mjs --write
      - name: Verify v2 checksum and complete change ledger
        run: node scripts/check-golden-v2.mjs
      - name: Verify legacy, DOM-free and correctness contracts
        run: |
          node scripts/check-french-intelligence.mjs
          node scripts/characterize-french-intelligence.mjs
          node scripts/check-french-intelligence-core.mjs
          node scripts/check-french-intelligence-correctness.mjs
          node scripts/check-french-intelligence-parity.mjs
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/french-academy-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/french-academy-http.log
          exit 1
      - name: Run browser checks and UI parity
        run: |
          node scripts/check-french-intelligence.browser.mjs
          node scripts/check-french-intelligence.ui-parity.mjs
      - name: Commit approved v2 golden and change ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/legacy-v2.json tests/golden/legacy-v2.sha256 docs/golden-changes.md
          if git diff --cached --quiet; then
            echo "No v2 golden changes to commit."
          else
            git commit -m "APPROVED GOLDEN UPDATE"
            git push
          fi
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[generate-v2]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify v2 checksum and complete change ledger
        run: node scripts/check-golden-v2.mjs
      - name: Verify compatibility outputs byte-for-byte against v2
        run: node scripts/check-french-intelligence-parity.mjs
      - name: Verify Section 14a correctness
        run: node scripts/check-french-intelligence-correctness.mjs
